name: Deploy SMMS to EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26' 
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/smms-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/smms"
          strip_components: 1

      - name: Execute Blue-Green Swap
        uses: appleboy/ssh-action@master
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              mv /home/ubuntu/smms/smms-0.0.1-SNAPSHOT.jar /home/ubuntu/smms/target-new.jar
              /home/ubuntu/deploy-backend.sh
            
